<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#070910">
  <meta name="description" content="Gunpowder / Pegasus Bluie identity hub">
  <title>Hachile Identity Hub</title>
  <link rel="stylesheet" href="./assets/style.css">
</head>
<body class="landing">
  <main class="landing-shell">
    <header class="brandline">
      <div>
        <p class="kicker">HACHILE IDENTITY HUB</p>
        <h2>Which side<br>are you looking for?</h2>
      </div>
      <p class="subtitle">我有两个不同的身份……</p>
    </header>

    <section class="identity-grid" aria-label="身份选择">
      <a class="identity-card human" href="./gunpowder/">
        <div class="card-content">
          <div class="card-profile">
            <img class="avatar" src="./assets/images/gunpowder-avatar.png" alt="Gunpowder avatar">
            <div>
              <span class="card-type">PERSONAL PROFILE</span>
              <h2>Gunpowder</h2>
              <p>Student · Developer · Community Builder</p>
            </div>
          </div>
          <div class="enter"><span>查看人类主页</span><strong>Enter →</strong></div>
        </div>
      </a>

      <a class="identity-card pony" href="./skyblue/">
        <div class="card-content">
          <div class="card-profile">
            <img class="avatar" src="./assets/images/skyblue-avatar.png" alt="Pegasus Bluie avatar">
            <div>
              <span class="card-type">PONSONA PROFILE</span>
              <h2>Pegasus Bluie</h2>
              <p>Skyblue Mornbreeze</p>
            </div>
          </div>
          <div class="enter"><span>查看小马主页</span><strong>Enter →</strong></div>
        </div>
      </a>
    </section>

    <footer class="landing-footer">
      <span>GPDdev.github.io · ALPHA</span>
      <span>Powered by GPDdev</span>
    </footer>
  </main>
</body>
</html>
